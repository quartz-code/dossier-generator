<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор Имён</title>
    <meta name="description" content="Генератор имён и фамилий для персонажей">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/names.css">
</head>
<body>
    <div class="names-screen-wrapper">
        <div class="names-container">
            <header class="names-header">
                <button class="btn-back-absolute" onclick="window.location.href='index.html'">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    Назад
                </button>
                <h1>Генератор имён</h1>
                <p>Быстрый подбор имён и фамилий для персонажей</p>
            </header>

            <div class="faction-tabs" style="display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap;">
                <button class="faction-tab-btn active" data-faction="germany">Германия</button>
                <button class="faction-tab-btn" data-faction="usa">США</button>
                <button class="faction-tab-btn" data-faction="ussr">СССР</button>
            </div>

            <div class="controls">
                <button class="control-btn active" data-gender="all">Все</button>
                <button class="control-btn" data-gender="male">Мужские</button>
                <button class="control-btn" data-gender="female">Женские</button>
            </div>

            <button id="generate-btn" class="generate-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12a9 9 0 11-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
                    <path d="M21 3v5h-5"/>
                </svg>
                Сгенерировать новые
            </button>

            <div class="results-grid" id="results-grid">
                <!-- Names will be injected here -->
            </div>
        </div>
    </div>

    <script src="js/names.js"></script>
</body>
</html>
